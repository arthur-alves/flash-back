<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashBack</title>
  <link rel="stylesheet" href="css/themes/dark.css" id="theme-link" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("flashback:theme");
      if (saved) document.getElementById("theme-link").href = "css/themes/" + saved + ".css";
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <h1>🕹️ FlashBack</h1>
    <nav class="main-nav">
      <a href="/" class="active" data-i18n="nav_all_games">All games</a>
      <a href="collections" data-i18n="nav_collections">Collections</a>
    </nav>
    <input id="search" type="search" data-i18n-placeholder="search_placeholder" placeholder="Search game..." autocomplete="off" />
    <button id="view-toggle" class="view-toggle-btn"></button>
    <select id="lang-select" class="theme-select"></select>
    <select id="theme-select" class="theme-select"></select>
  </header>

  <main>
    <div id="tags-row" class="tags-row hidden"></div>

    <div id="grid" class="grid"></div>
    <p id="empty" class="empty hidden" data-i18n="empty_games">No games found.</p>
  </main>

  <footer class="footer">
    <p data-i18n-html="footer_credits_html"></p>
    <p><a href="admin" data-i18n="admin_link">Administration</a></p>
  </footer>

  <script src="js/icons.js"></script>
  <script src="js/themes-registry.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/viewToggle.js"></script>
  <script src="js/library.js"></script>
</body>
</html>
