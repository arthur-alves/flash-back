<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash Games Server</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🕹️ Flash Games</h1>
    <nav class="main-nav">
      <a href="index.html" class="active">Todos os jogos</a>
      <a href="collections.html">Coleções</a>
    </nav>
    <input id="search" type="search" placeholder="Buscar jogo..." autocomplete="off" />
  </header>

  <main>
    <div id="tags-row" class="tags-row hidden"></div>

    <div id="grid" class="grid"></div>
    <p id="empty" class="empty hidden">Nenhum jogo encontrado.</p>

  <footer class="footer">
    <p>
      Coleção mantida pela comunidade a título de preservação histórica. Todos os direitos dos
      jogos pertencem aos seus respectivos criadores. Jogos obtidos de
      <a href="https://github.com/AmmarSAA/flash-games-directory" target="_blank" rel="noopener">AmmarSAA/flash-games-directory</a>.
      Emulado via <a href="https://ruffle.rs" target="_blank" rel="noopener">Ruffle</a>.
    </p>
    <p><a href="admin.html">Administração</a></p>
  </footer>

  <script src="js/library.js"></script>

</html>
