<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coleções — Flash Games Server</title>
  <link rel="stylesheet" href="css/themes/dark.css" id="theme-link" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("flash-games-server:theme");
      if (saved) document.getElementById("theme-link").href = "css/themes/" + saved + ".css";
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <h1>🕹️ Flash Games</h1>
    <nav class="main-nav">
      <a href="index.html">Todos os jogos</a>
      <a href="collections.html" class="active">Coleções</a>
    </nav>
    <button id="view-toggle" class="view-toggle-btn"></button>
    <select id="theme-select" class="theme-select"></select>
  </header>

  <main>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty hidden">Nenhuma coleção criada ainda.</p>
  </main>

  <footer class="footer">
    <p><a href="admin.html">Administração</a></p>
  </footer>

  <script src="js/icons.js"></script>
  <script src="js/themes-registry.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/viewToggle.js"></script>
  <script src="js/collections-page.js"></script>
</body>
</html>
