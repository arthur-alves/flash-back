<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash Games Server — Jogando</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>
    if (localStorage.getItem("flash-games-server:theme") === "light") {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <script src="ruffle/ruffle.js"></script>
</head>
<body class="play-page">
  <header class="topbar">
    <a href="index.html" id="back-link" class="back-link"></a>
    <h1 id="game-title">Carregando...</h1>
    <button id="crt-btn" class="crt-btn" title="Efeito CRT"></button>
    <button id="fullscreen-btn" class="fullscreen-btn" title="Tela cheia"></button>
    <button id="theme-toggle" class="icon-btn"></button>
  </header>

  <main class="player-wrap">
    <div id="player-container" class="player-container">
      <div class="crt-overlay"></div>
    </div>
    <p id="game-description" class="game-description"></p>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
