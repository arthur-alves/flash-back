<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collection — FlashBack</title>
  <link rel="stylesheet" href="css/themes/dark.css" id="theme-link" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("flashback:theme");
      if (saved) document.getElementById("theme-link").href = "css/themes/" + saved + ".css";
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a href="collections" id="back-link" class="back-link"></a>
    <h1 id="collection-title" data-i18n="loading">Loading...</h1>
    <button id="view-toggle" class="view-toggle-btn"></button>
    <select id="lang-select" class="theme-select"></select>
    <select id="theme-select" class="theme-select"></select>
  </header>

  <main>
    <p id="collection-description" class="collection-description"></p>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty hidden" data-i18n="empty_collection_games">No games in this collection yet.</p>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/themes-registry.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/viewToggle.js"></script>
  <script src="js/collection.js"></script>
</body>
</html>
