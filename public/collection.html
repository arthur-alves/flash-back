<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coleção — Flash Games Server</title>
  <link rel="stylesheet" href="css/themes/dark.css" id="theme-link" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("flash-games-server:theme");
      if (saved) document.getElementById("theme-link").href = "css/themes/" + saved + ".css";
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a href="collections.html" id="back-link" class="back-link"></a>
    <h1 id="collection-title">Carregando...</h1>
    <button id="view-toggle" class="view-toggle-btn"></button>
    <select id="theme-select" class="theme-select"></select>
  </header>

  <main>
    <p id="collection-description" class="collection-description"></p>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty hidden">Nenhum jogo nesta coleção ainda.</p>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/themes-registry.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/viewToggle.js"></script>
  <script src="js/collection.js"></script>
</body>
</html>
