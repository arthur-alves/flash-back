<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Flash Games Server</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>
    if (localStorage.getItem("flash-games-server:theme") === "light") {
      document.documentElement.dataset.theme = "light";
    }
  </script>
</head>
<body>
  <header class="topbar">
    <a href="index.html" id="back-link" class="back-link"></a>
    <h1>Administração</h1>
    <button id="logout-btn" class="logout-btn">Sair</button>
    <button id="theme-toggle" class="icon-btn"></button>
  </header>

  <main class="admin-main">
    <section class="admin-panel">
      <h2>Adicionar novo jogo</h2>
      <form id="upload-form" class="upload-form">
        <label>
          Arquivo .swf
          <input type="file" id="swf-file" name="swf" accept=".swf" required />
        </label>
        <label>
          Título
          <input type="text" id="game-title" name="title" required maxlength="100" />
        </label>
        <label>
          Descrição (opcional)
          <textarea id="game-description" name="description" rows="3" maxlength="500"></textarea>
        </label>
        <label>
          Capa (opcional — JPG, PNG ou WebP)
          <input type="file" id="cover-file" name="cover" accept=".jpg,.jpeg,.png,.webp" />
        </label>
        <label>
          Tags (opcional, separadas por vírgula)
          <input type="text" id="game-tags" name="tags" placeholder="ação, plataforma, clássico" />
        </label>
        <button type="submit" id="submit-btn">Enviar jogo</button>
        <p id="upload-status" class="upload-status"></p>
      </form>
    </section>

    <section class="admin-panel">
      <h2>Coleções</h2>
      <form id="collection-form" class="upload-form collection-form">
        <label>
          Nome
          <input type="text" id="collection-name" name="name" required maxlength="60" />
        </label>
        <label>
          Descrição (opcional)
          <input type="text" id="collection-description" name="description" maxlength="200" />
        </label>
        <button type="submit" id="collection-submit-btn">Criar coleção</button>
        <p id="collection-status" class="upload-status"></p>
      </form>
      <ul id="collections-list" class="collections-list"></ul>
    </section>

    <section class="admin-panel">
      <h2>Jogos cadastrados</h2>
      <table id="games-table" class="games-table">
        <thead>
          <tr>
            <th>Capa</th>
            <th>Título</th>
            <th>Arquivo</th>
            <th>Tamanho</th>
            <th>Tags</th>
            <th>Coleções</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="games-table-body"></tbody>
      </table>
    </section>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
