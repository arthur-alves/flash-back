<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Flash Games Server</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>
    if (localStorage.getItem("flash-games-server:theme") === "light") {
      document.documentElement.dataset.theme = "light";
    }
  </script>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="back-link">🕹️ Flash Games</a>
    <button id="theme-toggle" class="icon-btn"></button>
  </header>

  <main class="auth-main">
    <section class="admin-panel auth-panel">
      <h2>Entrar</h2>
      <form id="login-form" class="upload-form">
        <label>
          Usuário
          <input type="text" id="username" name="username" required autocomplete="username" />
        </label>
        <label>
          Senha
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </label>
        <button type="submit" id="submit-btn">Entrar</button>
        <p id="status" class="upload-status"></p>
      </form>
    </section>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
