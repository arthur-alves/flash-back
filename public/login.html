<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — FlashBack</title>
  <link rel="icon" href="images/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="images/icon-192.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/themes/dark.css" id="theme-link" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("flashback:theme");
      if (saved) document.getElementById("theme-link").href = "css/themes/" + saved + ".css";
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a href="/" class="logo-link"><img src="images/logo.png" alt="FlashBack" class="site-logo" /></a>
    <nav class="main-nav">
      <a href="/" data-i18n="nav_all_games">All games</a>
      <a href="collections" data-i18n="nav_collections">Collections</a>
    </nav>
    <select id="lang-select" class="theme-select"></select>
    <select id="theme-select" class="theme-select"></select>
  </header>

  <main class="auth-main">
    <section class="admin-panel auth-panel">
      <h2 data-i18n="login_title">Log in</h2>
      <form id="login-form" class="upload-form">
        <label>
          <span data-i18n="label_username">Username</span>
          <input type="text" id="username" name="username" required autocomplete="username" />
        </label>
        <label>
          <span data-i18n="label_password">Password</span>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </label>
        <button type="submit" id="submit-btn" data-i18n="login_button">Log in</button>
        <p id="status" class="upload-status"></p>
      </form>
    </section>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/themes-registry.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
